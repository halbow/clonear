// ---- app/lib/frontmatter.js ----
const __mod_lib_frontmatter = (() => {
// Tiny, dependency-free helpers for ticket files.
// - parseFrontmatter: split a raw .md file into its frontmatter fields and body
// - updateTicketText: rewrite some fields + the body, keeping every other line as-is
// - renderMarkdown: a minimal, safe markdown -> HTML renderer for ticket bodies
//
// Frontmatter is the YAML subset build.py understands: scalars, inline lists
// (`key: [a, b]`) and block lists (`key:` followed by `  - item` lines).
// renderMarkdown covers headings, bold/italic, inline code, fenced code blocks,
// links, unordered and ordered lists, and paragraphs. All text is HTML-escaped
// first, so its output is safe to inject with innerHTML.

// Returns { data, body, fmLines } where fmLines is null when there is no
// frontmatter block (or it is never closed).
function parseFrontmatter(text) {
  const lines = text.split(/\r?\n/);
  if (lines.length && lines[0].trim() === "---") {
    for (let i = 1; i < lines.length; i++) {
      if (lines[i].trim() === "---") {
        const fmLines = lines.slice(1, i);
        const body = lines.slice(i + 1).join("\n").replace(/^\n+|\n+$/g, "");
        return { data: parseFields(fmLines), body, fmLines };
      }
    }
  }
  return { data: {}, body: text, fmLines: null };
}

function stripFrontmatter(text) {
  return parseFrontmatter(text).body;
}

function parseFields(lines) {
  const data = {};
  let i = 0;
  while (i < lines.length) {
    const line = lines[i].trim();
    i++;
    if (!line || line.startsWith("#") || !line.includes(":")) continue;
    const idx = line.indexOf(":");
    const key = line.slice(0, idx).trim();
    const value = line.slice(idx + 1).trim();
    if (value === "") {
      // Possibly a block list on the following `- item` lines.
      const items = [];
      while (i < lines.length && lines[i].trim().startsWith("- ")) {
        items.push(scalar(lines[i].trim().slice(2).trim()));
        i++;
      }
      data[key] = items;
    } else if (value.startsWith("[") && value.endsWith("]")) {
      const inner = value.slice(1, -1).trim();
      data[key] = inner ? inner.split(",").map((v) => scalar(v.trim())) : [];
    } else {
      data[key] = scalar(value);
    }
  }
  return data;
}

function scalar(value) {
  if (value.length >= 2 && value[0] === value[value.length - 1] && (value[0] === '"' || value[0] === "'")) {
    return value.slice(1, -1);
  }
  return value;
}

function formatValue(value) {
  if (Array.isArray(value)) return `[${value.map((v) => formatScalar(v)).join(", ")}]`;
  return formatScalar(value);
}

function formatScalar(value) {
  const str = String(value).replace(/\s*\r?\n\s*/g, " ");
  // Quote anything the parser would otherwise read as a list, comment or quote.
  if (/^[\[#"'-]|^\s|\s$/.test(str)) {
    return str.includes('"') ? `'${str}'` : `"${str}"`;
  }
  return str;
}

// Rewrite `fields` (a { key: value } map) and the body of a ticket file.
// Keys that already exist are replaced in place; new keys are appended; a key
// whose value is "" or null is removed. Every other frontmatter line (unknown
// keys, comments) is preserved verbatim.
function updateTicketText(raw, fields, body) {
  const fmLines = [...(parseFrontmatter(raw).fmLines || [])];

  for (const [key, value] of Object.entries(fields)) {
    const start = fmLines.findIndex((l) => {
      const t = l.trim();
      return t.includes(":") && !t.startsWith("- ") && t.slice(0, t.indexOf(":")).trim() === key;
    });
    const remove = value === null || value === undefined || value === "";
    const line = `${key}: ${formatValue(value)}`;

    if (start === -1) {
      if (!remove) fmLines.push(line);
      continue;
    }
    // A key with an empty inline value may own the block-list lines below it.
    let end = start + 1;
    if (fmLines[start].trim().endsWith(":")) {
      while (end < fmLines.length && fmLines[end].trim().startsWith("- ")) end++;
    }
    fmLines.splice(start, end - start, ...(remove ? [] : [line]));
  }

  const text = ["---", ...fmLines, "---"].join("\n");
  const trimmed = (body || "").replace(/^\n+|\s+$/g, "");
  return trimmed ? `${text}\n\n${trimmed}\n` : `${text}\n`;
}

function escapeHtml(str) {
  return str
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderInline(text) {
  // Order matters: escape first, then apply inline patterns on the escaped text.
  let out = escapeHtml(text);
  // inline code `code`
  out = out.replace(/`([^`]+)`/g, (_m, code) => `<code>${code}</code>`);

  out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_m, label, url) => {
    const safe = /^https?:\/\/|^\/|^\.\.?\//.test(url) ? url : "#";
    return `<a href="${safe}" target="_blank" rel="noopener noreferrer">${label}</a>`;
  });
  // bold **text**
  out = out.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  // italic *text* (avoid matching ** already consumed)
  out = out.replace(/(^|[^*])\*([^*]+)\*/g, "$1<em>$2</em>");
  return out;
}

function renderMarkdown(md) {
  const lines = md.split(/\r?\n/);
  const html = [];
  let i = 0;
  let listType = null; // "ul" | "ol" | null

  const closeList = () => {
    if (listType) {
      html.push(`</${listType}>`);
      listType = null;
    }
  };

  while (i < lines.length) {
    const line = lines[i];

    // fenced code block
    if (/^```/.test(line.trim())) {
      closeList();
      const buf = [];
      i++;
      while (i < lines.length && !/^```/.test(lines[i].trim())) {
        buf.push(escapeHtml(lines[i]));
        i++;
      }
      i++; // consume closing fence
      html.push(`<pre><code>${buf.join("\n")}</code></pre>`);
      continue;
    }

    // headings
    const heading = line.match(/^(#{1,6})\s+(.*)$/);
    if (heading) {
      closeList();
      const level = heading[1].length;
      html.push(`<h${level}>${renderInline(heading[2])}</h${level}>`);
      i++;
      continue;
    }

    // unordered list
    if (/^\s*[-*]\s+/.test(line)) {
      if (listType !== "ul") {
        closeList();
        html.push("<ul>");
        listType = "ul";
      }
      html.push(`<li>${renderInline(line.replace(/^\s*[-*]\s+/, ""))}</li>`);
      i++;
      continue;
    }

    // ordered list
    if (/^\s*\d+\.\s+/.test(line)) {
      if (listType !== "ol") {
        closeList();
        html.push("<ol>");
        listType = "ol";
      }
      html.push(`<li>${renderInline(line.replace(/^\s*\d+\.\s+/, ""))}</li>`);
      i++;
      continue;
    }

    // blank line
    if (line.trim() === "") {
      closeList();
      i++;
      continue;
    }

    // paragraph (accumulate consecutive non-blank, non-special lines)
    closeList();
    const para = [line];
    i++;
    while (
      i < lines.length &&
      lines[i].trim() !== "" &&
      !/^(#{1,6})\s|^\s*[-*]\s|^\s*\d+\.\s|^```/.test(lines[i])
    ) {
      para.push(lines[i]);
      i++;
    }
    html.push(`<p>${renderInline(para.join(" "))}</p>`);
  }

  closeList();
  return html.join("\n");
}

return { parseFrontmatter, stripFrontmatter, updateTicketText, renderMarkdown };
})();

// ---- app/lib/search.js ----
const __mod_lib_search = (() => {
// Fuzzy ticket search for the top bar.
//
// The query is split on whitespace; every word must match the ticket. A word
// matches when it appears as a substring of the id, title, labels, assignee,
// size or description, or as a fuzzy subsequence of "id title" (so "rdhst"
// finds "Ride history"). Matching ignores case and accents.
//
// scoreTicket returns 0 for no match, otherwise a higher-is-better score:
// title/id hits beat label hits, which beat description hits, and substring
// hits beat subsequence hits.

function normalize(str) {
  return String(str || "")
    .normalize("NFD")
    .replace(/[̀-ͯ]/g, "")
    .toLowerCase();
}

// Score `needle` as an in-order subsequence of `hay`: 0 if it isn't one,
// more when the characters are consecutive or start a word. Letters scattered
// with no word starts or runs ("bio" in "mob offline") score 0 too.
function fuzzyScore(needle, hay) {
  if (!needle) return 0;
  let score = 0;
  let prev = -2;
  let from = 0;
  for (const ch of needle) {
    const i = hay.indexOf(ch, from);
    if (i === -1) return 0;
    score += 1;
    if (i === prev + 1) score += 2; // consecutive
    if (i === 0 || /[\s\-_/]/.test(hay[i - 1])) score += 3; // word start
    prev = i;
    from = i + 1;
  }
  return score >= needle.length * 2 ? score : 0;
}

function scoreTicket(ticket, query) {
  const words = normalize(query).split(/\s+/).filter(Boolean);
  if (!words.length) return 1;
  const head = normalize(`${ticket.id} ${ticket.title}`);
  const tags = normalize([...(ticket.labels || []), ticket.assignee, ticket.size].join(" "));
  const body = normalize(ticket.body);

  let total = 0;
  for (const w of words) {
    let s = 0;
    if (head.includes(w)) s = 100 + (head.startsWith(w) || head.includes(` ${w}`) ? 20 : 0);
    else if (tags.includes(w)) s = 60;
    else if (body.includes(w)) s = 30;
    else if (w.length >= 2) s = fuzzyScore(w, head);
    if (!s) return 0;
    total += s;
  }
  return total;
}

return { normalize, fuzzyScore, scoreTicket };
})();

// ---- app/lib/store.js ----
const __mod_lib_store = (() => {
// Board storage backends. Both expose the same shape to the UI:
//
//   scan()                         -> { projects: [{ id, name, columns: [{ id, label, tickets }] }] }
//   readText(ticket)               -> the file's current content
//   writeTicket(ticket, raw, opts) -> { lastModified }      (throws ConflictError)
//   moveTicket(ticket, columnId)   -> { lastModified }
//   createTicket(project, columnId, id, raw)
//   deleteTicket(ticket)
//   watch(onChange)                -> { mode, stop }
//
// - FsBackend: a local folder opened with the File System Access API
//   (showDirectoryPicker). Read-write, watches the folder for outside changes.
// - HttpBackend: the manifest.json produced by build.py, served over HTTP.
//   Read-only; used for the GitHub Pages deploy.
//
// Data model: <projects root>/<project>/<column>/<TICKET-ID>.md, with an
// optional <project>/project.md that sets the display name and column order.

const { parseFrontmatter } = __mod_lib_frontmatter;
const DEFAULT_COLUMNS = ["todo", "in-progress", "in-qa", "done"];

const PRIORITY_ORDER = { urgent: 0, high: 1, medium: 2, low: 3, none: 4 };
const SIZES = ["S", "M", "L"];
const ACRONYMS = new Set(["qa", "ui", "ci", "api", "id", "ux"]);
// Folders that can hold projects when the user picks a repo root.
const CONTAINER_DIRS = ["projects", "tickets"];
const SKIP_DIRS = new Set(["node_modules", "dist", "build"]);

class ConflictError extends Error {
  constructor() {
    super("The file changed on disk since it was loaded.");
    this.name = "ConflictError";
  }
}

function titleize(slug) {
  const words = slug
    .replace(/_/g, "-")
    .split("-")
    .filter(Boolean)
    .map((w) => (ACRONYMS.has(w.toLowerCase()) ? w.toUpperCase() : w[0].toUpperCase() + w.slice(1)));
  return words.join(" ") || slug;
}

// Build the ticket fields the UI needs from a raw .md file.
function ticketFromText(id, raw) {
  const { data, body } = parseFrontmatter(raw);
  const str = (v) => (Array.isArray(v) ? v.join(", ") : v || "");
  let labels = data.labels || [];
  if (!Array.isArray(labels)) labels = [labels];
  const priority = str(data.priority).toLowerCase();
  const size = str(data.size).toUpperCase();
  return {
    id,
    raw,
    body,
    title: str(data.title) || id,
    assignee: str(data.assignee),
    priority: priority in PRIORITY_ORDER ? priority : "none",
    size: SIZES.includes(size) ? size : "",
    labels: labels.filter(Boolean),
    created: str(data.created),
  };
}

function sortTickets(tickets) {
  const idNum = (t) => Number((t.id.match(/(\d+)$/) || [0, 0])[1]);
  return tickets.sort(
    (a, b) =>
      PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority] ||
      b.created.localeCompare(a.created) ||
      idNum(b) - idNum(a)
  );
}

// Next free id in a project, e.g. WEB-6. Reuses the prefix already in use.
function nextTicketId(project) {
  const ids = project.columns.flatMap((c) => c.tickets.map((t) => t.id));
  const parsed = ids.map((id) => id.match(/^([A-Za-z]+)-(\d+)$/)).filter(Boolean);
  const prefix =
    (parsed[0] && parsed[0][1]) || project.id.toUpperCase().replace(/[^A-Z]/g, "").slice(0, 3) || "TIX";
  const max = Math.max(0, ...parsed.filter((m) => m[1] === prefix).map((m) => Number(m[2])));
  return `${prefix}-${max + 1}`;
}

function projectFromParts(id, projectMd, dirNames) {
  let name = titleize(id);
  let columns = [...DEFAULT_COLUMNS];
  if (projectMd) {
    const { data } = parseFrontmatter(projectMd);
    if (typeof data.name === "string" && data.name) name = data.name;
    if (Array.isArray(data.columns) && data.columns.length) columns = data.columns.filter(Boolean);
  }
  // Include every column folder that exists on disk, even if project.md omits it.
  for (const d of dirNames) if (!columns.includes(d)) columns.push(d);
  return { id, name, columns: columns.map((c) => ({ id: c, label: titleize(c), tickets: [] })) };
}

// --------------------------------------------------------------------------- //
// File System Access backend
// --------------------------------------------------------------------------- //
const fsSupported = typeof window.showDirectoryPicker === "function";

async function listEntries(dir) {
  const entries = [];
  for await (const [name, handle] of dir.entries()) {
    if (name.startsWith(".")) continue;
    entries.push({ name, kind: handle.kind, handle });
  }
  return entries.sort((a, b) => a.name.localeCompare(b.name));
}

const looksLikeProject = (entries) =>
  entries.some(
    (e) =>
      (e.kind === "file" && e.name === "project.md") ||
      (e.kind === "directory" && DEFAULT_COLUMNS.includes(e.name))
  );

class FsBackend {
  readOnly = false;

  constructor(root) {
    this.root = root;
    this.cache = new Map(); // path -> { lastModified, size, raw }
  }

  get name() {
    return this.root.name;
  }

  async hasPermission() {
    return (await this.root.queryPermission({ mode: "readwrite" })) === "granted";
  }

  // Accepts: a single project folder, a folder containing projects/ or tickets/,
  // or a folder whose subfolders are projects.
  async resolveProjects() {
    const entries = await listEntries(this.root);
    if (looksLikeProject(entries)) return [{ id: this.root.name, dir: this.root, entries }];

    const container = entries.find((e) => e.kind === "directory" && CONTAINER_DIRS.includes(e.name));
    const baseEntries = container ? await listEntries(container.handle) : entries;
    const found = [];
    for (const e of baseEntries) {
      if (e.kind !== "directory" || SKIP_DIRS.has(e.name)) continue;
      const sub = await listEntries(e.handle);
      if (container || looksLikeProject(sub)) found.push({ id: e.name, dir: e.handle, entries: sub });
    }
    return found;
  }

  async scan() {
    const found = await this.resolveProjects();
    const projects = await Promise.all(found.map((p) => this.scanProject(p)));
    return { projects };
  }

  async scanProject({ id, dir, entries }) {
    const projectMdEntry = entries.find((e) => e.kind === "file" && e.name === "project.md");
    const projectMd = projectMdEntry ? await (await projectMdEntry.handle.getFile()).text() : null;
    const dirs = entries.filter((e) => e.kind === "directory");
    const project = projectFromParts(id, projectMd, dirs.map((d) => d.name));
    project.dir = dir;

    await Promise.all(
      project.columns.map(async (col) => {
        const entry = dirs.find((d) => d.name === col.id);
        col.dir = entry ? entry.handle : null;
        if (!col.dir) return;
        const files = (await listEntries(col.dir)).filter((e) => e.kind === "file" && e.name.endsWith(".md"));
        col.tickets = sortTickets(
          await Promise.all(files.map((f) => this.readTicket(project, col, f.name, f.handle)))
        );
      })
    );
    return project;
  }

  async readTicket(project, col, fileName, handle) {
    const path = `${project.id}/${col.id}/${fileName}`;
    const file = await handle.getFile();
    let cached = this.cache.get(path);
    if (!cached || cached.lastModified !== file.lastModified || cached.size !== file.size) {
      cached = { lastModified: file.lastModified, size: file.size, raw: await file.text() };
      this.cache.set(path, cached);
    }
    return {
      ...ticketFromText(fileName.replace(/\.md$/, ""), cached.raw),
      path,
      projectId: project.id,
      column: col.id,
      lastModified: file.lastModified,
      bytes: file.size, // file size on disk; `size` is the S/M/L estimate
      fileName,
      handle,
      dirHandle: col.dir,
      projectDir: project.dir,
    };
  }

  async readText(ticket) {
    return (await ticket.handle.getFile()).text();
  }

  async writeTicket(ticket, raw, { force = false } = {}) {
    const current = await ticket.handle.getFile();
    if (!force && current.lastModified !== ticket.lastModified) throw new ConflictError();
    await writeFile(ticket.handle, raw);
    return { lastModified: (await ticket.handle.getFile()).lastModified };
  }

  async moveTicket(ticket, columnId) {
    const dest = await ticket.projectDir.getDirectoryHandle(columnId, { create: true });
    if (await fileExists(dest, ticket.fileName)) {
      throw new Error(`${columnId}/${ticket.fileName} already exists.`);
    }
    // FileSystemHandle.move() is Chromium-only and newer for user-visible files;
    // fall back to copy + delete where it is missing or refused.
    if (typeof ticket.handle.move === "function") {
      try {
        await ticket.handle.move(dest);
        return { lastModified: (await ticket.handle.getFile()).lastModified };
      } catch {
        // The move may have gone through before failing; otherwise fall back.
        if (!(await fileExists(ticket.dirHandle, ticket.fileName))) {
          const moved = await dest.getFileHandle(ticket.fileName);
          return { lastModified: (await moved.getFile()).lastModified };
        }
      }
    }
    const raw = await (await ticket.handle.getFile()).text();
    const copy = await dest.getFileHandle(ticket.fileName, { create: true });
    await writeFile(copy, raw);
    await ticket.dirHandle.removeEntry(ticket.fileName);
    return { lastModified: (await copy.getFile()).lastModified };
  }

  async createTicket(project, columnId, id, raw) {
    const dir = await project.dir.getDirectoryHandle(columnId, { create: true });
    const fileName = `${id}.md`;
    if (await fileExists(dir, fileName)) throw new Error(`${columnId}/${fileName} already exists.`);
    await writeFile(await dir.getFileHandle(fileName, { create: true }), raw);
  }

  async deleteTicket(ticket) {
    await ticket.dirHandle.removeEntry(ticket.fileName);
    this.cache.delete(ticket.path);
  }

  // Calls onChange() whenever something may have changed on disk. Uses
  // FileSystemObserver where available and polling as the fallback (and as a
  // slow safety net, since observers can drop events).
  async watch(onChange) {
    let observer = null;
    let debounce = null;
    const trigger = () => {
      clearTimeout(debounce);
      debounce = setTimeout(onChange, 120);
    };
    if (typeof window.FileSystemObserver === "function") {
      try {
        observer = new window.FileSystemObserver(trigger);
        await observer.observe(this.root, { recursive: true });
      } catch {
        observer = null;
      }
    }
    const interval = setInterval(onChange, observer ? 10000 : 1500);
    const onFocus = () => document.visibilityState === "visible" && trigger();
    document.addEventListener("visibilitychange", onFocus);
    window.addEventListener("focus", onFocus);
    return {
      mode: observer ? "live" : "polling",
      stop() {
        clearInterval(interval);
        clearTimeout(debounce);
        if (observer) observer.disconnect();
        document.removeEventListener("visibilitychange", onFocus);
        window.removeEventListener("focus", onFocus);
      },
    };
  }
}

async function writeFile(handle, text) {
  const writable = await handle.createWritable();
  await writable.write(text);
  await writable.close();
}

async function fileExists(dir, name) {
  try {
    await dir.getFileHandle(name);
    return true;
  } catch {
    return false;
  }
}

// --------------------------------------------------------------------------- //
// Read-only HTTP backend (manifest.json from build.py)
// --------------------------------------------------------------------------- //
class HttpBackend {
  readOnly = true;
  name = "manifest.json";

  constructor(baseUrl) {
    this.baseUrl = baseUrl; // URL of the repo root, which holds manifest.json
  }

  async scan() {
    const res = await fetch(new URL("manifest.json", this.baseUrl), { cache: "no-cache" });
    if (!res.ok) throw new Error(`manifest.json: HTTP ${res.status}`);
    const manifest = await res.json();
    const projects = await Promise.all(
      (manifest.projects || []).map(async (p) => {
        const project = projectFromParts(p.id, null, []);
        project.name = p.name;
        project.columns = await Promise.all(
          (p.columnOrder || Object.keys(p.columns)).map(async (colId) => ({
            id: colId,
            label: (p.columnLabels && p.columnLabels[colId]) || titleize(colId),
            tickets: sortTickets(
              await Promise.all(
                (p.columns[colId] || []).map(async (t) => {
                  const raw = await fetch(new URL(t.path, this.baseUrl), { cache: "no-cache" })
                    .then((r) => (r.ok ? r.text() : ""))
                    .catch(() => "");
                  return { ...ticketFromText(t.id, raw), path: t.path, projectId: p.id, column: colId };
                })
              )
            ),
          }))
        );
        return project;
      })
    );
    return { projects };
  }

  async watch() {
    return { mode: "read-only", stop() {} };
  }
}

// --------------------------------------------------------------------------- //
// Remember the opened folder per page URL (IndexedDB can store handles).
// --------------------------------------------------------------------------- //
const DB_NAME = "cloinear";
const handleKey = () => location.origin + location.pathname;

function withStore(mode, fn) {
  return new Promise((resolve, reject) => {
    const open = indexedDB.open(DB_NAME, 1);
    open.onupgradeneeded = () => open.result.createObjectStore("handles");
    open.onerror = () => reject(open.error);
    open.onsuccess = () => {
      const tx = open.result.transaction("handles", mode);
      const req = fn(tx.objectStore("handles"));
      tx.oncomplete = () => resolve(req && req.result);
      tx.onerror = () => reject(tx.error);
    };
  });
}

const saveHandle = (handle) => withStore("readwrite", (s) => s.put(handle, handleKey()));
const loadHandle = () => withStore("readonly", (s) => s.get(handleKey())).catch(() => null);
const forgetHandle = () => withStore("readwrite", (s) => s.delete(handleKey()));

return { DEFAULT_COLUMNS, SIZES, ConflictError, titleize, ticketFromText, nextTicketId, fsSupported, FsBackend, HttpBackend, saveHandle, loadHandle, forgetHandle };
})();

async function pickFolder() {

    return;

async function reconnect(handle) {
  const perm = await handle.requestPermission({ mode: "readwrite" }).catch(() => "denied");
  if (perm === "granted") connect(new FsBackend(handle));
  else toast("Permission to the folder was not granted.", "error");

async function connect(backend, board) {
  if (state.watcher) state.watcher.stop();
  closeDrawer();
  Object.assign(state, { backend, watcher: null, board: null, signature: "" });
  if (board) applyBoard(board);
  else await refresh();
  if (state.backend !== backend || !state.board) return;
  state.watcher = await backend.watch(refresh);
  renderTopbar();
}

function disconnect(reason) {
  if (state.watcher) state.watcher.stop();
  const stored = state.backend instanceof FsBackend ? state.backend.root : null;
  closeDrawer();
  Object.assign(state, { backend: null, watcher: null, board: null, signature: "" });
  renderStart({ stored, reason });
}

// Rescan the backend; coalesces overlapping calls into one extra pass.
function refresh() {
  if (!state.backend) return Promise.resolve();
  if (state.scanning) {
    state.rescan = true;
    return state.scanning;
  }
  const backend = state.backend;
  state.scanning = (async () => {
    try {
      do {
        state.rescan = false;
        const board = await backend.scan();
        if (state.backend === backend) applyBoard(board);
      } while (state.rescan && state.backend === backend);
    } catch (err) {
      if (state.backend !== backend) return;
      if (err.name === "NotAllowedError" || err.name === "NotFoundError") {
        disconnect("Lost access to the folder.");
      } else {
        toast(`Could not read the folder: ${err.message}`, "error");
      }
    } finally {
      state.scanning = null;
    }
  })();
  return state.scanning;
}

function applyBoard(board) {
  const signature = JSON.stringify(
    board.projects.map((p) => [
      p.id,
      p.name,
      p.columns.map((c) => [c.id, c.tickets.map((t) => [t.id, t.lastModified, t.bytes, t.size, t.raw.length])]),
    ])
  );
  if (signature === state.signature) return;
  state.signature = signature;
  state.board = board;

  renderProjectSelect();
  if (!board.projects.length) {
    renderStart({ empty: true });
    return;
  }
  syncFromUrl();
  syncDrawerWithDisk();
}

// --------------------------------------------------------------------------- //
// Projects & URL (#project=<id>, a hash so it also works on file://)
// --------------------------------------------------------------------------- //
function syncFromUrl() {
  if (!state.board || !state.board.projects.length) return;
  const wanted = new URLSearchParams(location.hash.slice(1)).get("project");
  const projects = state.board.projects;
  const found = projects.find((p) => p.id === wanted) || projects.find((p) => p.id === state.projectId);
  selectProject((found || projects[0]).id, { pushUrl: false });
}

function selectProject(projectId, { pushUrl }) {
  if (state.drawer && state.drawer.projectId !== projectId) closeDrawer();
  state.projectId = projectId;
  els.select.value = projectId;
  if (pushUrl) location.hash = `project=${encodeURIComponent(projectId)}`;
  renderBoard();
}

function currentProject() {
  return state.board && state.board.projects.find((p) => p.id === state.projectId);
}

function findTicket(projectId, ticketId) {
  const project = state.board && state.board.projects.find((p) => p.id === projectId);
  if (!project) return null;
  for (const col of project.columns) {
    const t = col.tickets.find((x) => x.id === ticketId);
    if (t) return t;
  }
  return null;
}

// --------------------------------------------------------------------------- //
// Rendering: top bar, start screen, board, cards
// --------------------------------------------------------------------------- //
function renderTopbar() {
  const backend = state.backend;
  const hasBoard = !!(backend && state.board && state.board.projects.length);
  els.select.hidden = !hasBoard;
  els.newTicket.hidden = !hasBoard || backend.readOnly;
  els.count.hidden = !hasBoard;
  els.searchBox.hidden = !hasBoard;

  const mode = state.watcher ? state.watcher.mode : null;
  if (!backend || !mode) {
    els.sync.hidden = true;
  } else {
    els.sync.hidden = false;
    els.sync.className = `sync-status sync-${mode}`;
    els.sync.textContent =
      mode === "live" ? backend.name : mode === "polling" ? backend.name : "Read-only";
    els.sync.title =
      mode === "live"
        ? "Watching the folder for changes"
        : mode === "polling"
          ? "Checking the folder for changes every 1.5s"
          : "Served from manifest.json. Open a local folder to edit.";
  }
}

function renderProjectSelect() {
  const projects = state.board ? state.board.projects : [];
  els.select.innerHTML = projects
    .map((p) => `<option value="${escapeAttr(p.id)}">${escapeHtml(p.name)}</option>`)
    .join("");
  if (state.projectId) els.select.value = state.projectId;
  renderTopbar();
}

function renderStart({ stored = null, reason = "", empty = false }) {
  renderTopbar();
  els.count.hidden = true;
  let body;
  if (!fsSupported) {
    body = `
      <h2>Open this board in Chrome, Edge or Arc</h2>
      <p>Cloinear reads and writes your ticket folder with the File System Access API,
      which only Chromium-based browsers support.</p>`;
  } else if (empty) {
    body = `
      <h2>No projects in “${escapeHtml(state.backend.name)}”</h2>
      <p>Pick a folder laid out like <code>&lt;project&gt;/todo/TICKET-1.md</code>,
      a folder containing <code>projects/</code>, or a single project folder with
      <code>todo/</code>, <code>done/</code>… subfolders.</p>
      <div class="start-actions"><button class="btn btn-primary" data-action="pick">Choose another folder</button></div>`;
  } else if (stored) {
    body = `
      <h2>${reason ? escapeHtml(reason) : "Welcome back"}</h2>
      <p>Allow access to <strong>${escapeHtml(stored.name)}</strong> to load the board.</p>
      <div class="start-actions">
        <button class="btn btn-primary" data-action="reconnect">Open “${escapeHtml(stored.name)}”</button>
        <button class="btn" data-action="pick">Choose another folder</button>
      </div>`;
  } else {
    body = `
      <h2>Open a ticket folder</h2>
      <p>Pick the folder that holds your tickets: the one containing <code>projects/</code>,
      or a project folder with <code>todo/</code>, <code>in-progress/</code>, <code>done/</code>…
      Changes you make here are written straight to the <code>.md</code> files, and changes made
      on disk show up here live.</p>
      <div class="start-actions"><button class="btn btn-primary" data-action="pick">Open folder</button></div>`;
  }
  els.board.innerHTML = `<div class="start-panel">${body}</div>`;
  const pick = els.board.querySelector('[data-action="pick"]');
  if (pick) pick.addEventListener("click", pickFolder);
  const again = els.board.querySelector('[data-action="reconnect"]');
  if (again) again.addEventListener("click", () => reconnect(stored));
}

function renderBoard() {
  if (state.dragging) {
    state.renderPending = true;
    return;
  }
  state.renderPending = false;
  const project = currentProject();
  if (!project) return;
  const readOnly = state.backend.readOnly;
  const query = state.query.trim();
  let total = 0;
  let shown = 0;

  els.board.innerHTML = "";
  for (const col of project.columns) {
    total += col.tickets.length;
    // While searching, keep only matches, best first.
    const tickets = query
      ? col.tickets
          .map((t) => ({ t, score: scoreTicket(t, query) }))
          .filter((m) => m.score > 0)
          .sort((a, b) => b.score - a.score)
          .map((m) => m.t)
      : col.tickets;
    shown += tickets.length;
    const column = document.createElement("section");
    column.className = "column";
    column.dataset.column = col.id;
    column.innerHTML = `
      <div class="column-header">
        <span class="column-title">${escapeHtml(col.label)}</span>
        <span class="column-count">${tickets.length}</span>
        ${readOnly ? "" : `<button class="column-add" title="New ticket in ${escapeAttr(col.label)}" aria-label="New ticket in ${escapeAttr(col.label)}">+</button>`}
      </div>
      <div class="column-cards"></div>
    `;
    const cardsEl = column.querySelector(".column-cards");
    if (tickets.length === 0) {
      cardsEl.innerHTML = `<div class="column-empty">${query ? "No matches" : "No tickets"}</div>`;
    } else {
      for (const ticket of tickets) cardsEl.appendChild(renderCard(ticket, readOnly));
    }
    if (!readOnly) {
      column.querySelector(".column-add").addEventListener("click", () => openCreate(project.id, col.id));
      bindDropTarget(column, project.id, col.id);
    }
    els.board.appendChild(column);
  }
  els.count.hidden = false;
  els.count.textContent = query
    ? `${shown} of ${total} ticket${total === 1 ? "" : "s"}`
    : `${total} ticket${total === 1 ? "" : "s"}`;
}

function renderCard(ticket, readOnly) {
  const prio = PRIORITIES[ticket.priority];
  const card = document.createElement("article");
  card.className = "card";
  card.tabIndex = 0;
  card.setAttribute("role", "button");
  card.dataset.id = ticket.id;

  const labels = ticket.labels.map((l) => `<span class="chip">${escapeHtml(l)}</span>`).join("");
  card.innerHTML = `
    <div class="card-top">
      <span class="card-id">${escapeHtml(ticket.id)}</span>
      <span class="card-badges">
        ${ticket.size ? `<span class="size" title="Size ${ticket.size}">${ticket.size}</span>` : ""}
        <span class="prio ${prio.cls}" title="${prio.label}"></span>
      </span>
    </div>
    <div class="card-title">${escapeHtml(ticket.title)}</div>
    <div class="card-labels">${labels}</div>
    <div class="card-footer">
      ${ticket.assignee ? `<span class="avatar" title="${escapeAttr(ticket.assignee)}">${initials(ticket.assignee)}</span>` : "<span></span>"}
      ${ticket.created ? `<span class="card-date">${escapeHtml(ticket.created)}</span>` : ""}
    </div>
  `;

  const open = () => openTicket(ticket.projectId, ticket.id);
  card.addEventListener("click", open);
  card.addEventListener("keydown", (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      open();
    }
  });

  if (!readOnly) {
    card.draggable = true;
    card.addEventListener("dragstart", (e) => {
      state.dragging = { projectId: ticket.projectId, ticketId: ticket.id };
      e.dataTransfer.effectAllowed = "move";
      e.dataTransfer.setData("text/plain", ticket.id);
      requestAnimationFrame(() => card.classList.add("dragging"));
    });
    card.addEventListener("dragend", () => {
      card.classList.remove("dragging");
      state.dragging = null;
      document.querySelectorAll(".drop-target").forEach((el) => el.classList.remove("drop-target"));
      if (state.renderPending) renderBoard();
    });
  }
  return card;
}

function bindDropTarget(column, projectId, columnId) {
  column.addEventListener("dragover", (e) => {
    if (!state.dragging) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    column.classList.add("drop-target");
  });
  column.addEventListener("dragleave", (e) => {
    if (!column.contains(e.relatedTarget)) column.classList.remove("drop-target");
  });
  column.addEventListener("drop", (e) => {
    e.preventDefault();
    column.classList.remove("drop-target");
    const drag = state.dragging;
    if (!drag) return;
    const ticket = findTicket(drag.projectId, drag.ticketId);
    if (!ticket || ticket.column === columnId) return;
    // Optimistic: show the card in its new column right away.
    const card = els.board.querySelector(`.card[data-id="${CSS.escape(drag.ticketId)}"]`);
    const cards = column.querySelector(".column-cards");
    if (card) {
      cards.querySelector(".column-empty")?.remove();
      cards.prepend(card);
    }
    moveTicket(projectId, drag.ticketId, columnId);
  });
}

// --------------------------------------------------------------------------- //
// Mutations
// --------------------------------------------------------------------------- //
async function moveTicket(projectId, ticketId, columnId) {
  const ticket = findTicket(projectId, ticketId);
  if (!ticket || ticket.column === columnId) return;
  const d = state.drawer;
  if (d && d.ticketId === ticketId) await saveNow();
  try {
    const { lastModified } = await state.backend.moveTicket(findTicket(projectId, ticketId), columnId);
    if (d && d === state.drawer && d.ticketId === ticketId) d.base.lastModified = lastModified;
  } catch (err) {
    toast(`Could not move ${ticketId}: ${err.message}`, "error");
  }
  state.signature = ""; // force a re-render even if the optimistic DOM already matches
  await refresh();
}

// --------------------------------------------------------------------------- //
// Drawer: view / edit / create
// --------------------------------------------------------------------------- //
function openTicket(projectId, ticketId) {
  const ticket = findTicket(projectId, ticketId);
  if (!ticket) return;
  if (state.drawer) closeDrawer();
  const readOnly = state.backend.readOnly;
  state.drawer = {
    mode: "edit",
    projectId,
    ticketId,
    base: { raw: ticket.raw, lastModified: ticket.lastModified },
    dirty: false,
    version: 0,
    saving: null,
    saveTimer: null,
    conflict: false,
    deleted: false,
    bodyMode: readOnly || ticket.body.trim() ? "preview" : "write",
  };
  buildDrawer({ readOnly });
  fillDrawer(ticket);
  showDrawer();
}

function openCreate(projectId, columnId) {
  const project = state.board.projects.find((p) => p.id === projectId);
  if (!project || state.backend.readOnly) return;
  if (state.drawer) closeDrawer();
  state.drawer = { mode: "create", projectId, column: columnId || project.columns[0].id, bodyMode: "write" };
  buildDrawer({ readOnly: false });
  fillDrawer({
    id: nextTicketId(project),
    title: "",
    priority: "none",
    size: "",
    assignee: "",
    labels: [],
    created: today(),
    body: "",
    column: state.drawer.column,
  });
  showDrawer();
  document.getElementById("f-title").focus();
}

function buildDrawer({ readOnly }) {
  const d = state.drawer;
  const project = state.board.projects.find((p) => p.id === d.projectId);
  const dis = readOnly ? "disabled" : "";
  const columnOptions = project.columns
    .map((c) => `<option value="${escapeAttr(c.id)}">${escapeHtml(c.label)}</option>`)
    .join("");
  const prioOptions = Object.entries(PRIORITIES)
    .map(([id, p]) => `<option value="${id}">${p.label}</option>`)
    .join("");
  const sizeOptions = ["", ...SIZES].map((s) => `<option value="${s}">${s || "—"}</option>`).join("");

  els.drawerContent.innerHTML = `
    <div class="dt-bar">
      <span class="dt-id" id="f-id"></span>
      <span class="dt-save" id="dt-save"></span>
    </div>
    <div class="dt-banner" id="dt-banner" hidden></div>
    <textarea class="dt-title" id="f-title" rows="1" placeholder="Ticket title" ${dis}></textarea>
    <div class="dt-meta">
      <label><span>Status</span><select id="f-column" ${dis}>${columnOptions}</select></label>
      <label><span>Priority</span><select id="f-priority" ${dis}>${prioOptions}</select></label>
      <label><span>Size</span><select id="f-size" ${dis}>${sizeOptions}</select></label>
      <label id="f-assignee-row"><span>Assignee</span><input id="f-assignee" placeholder="—" ${dis} /></label>
      <label><span>Labels</span><input id="f-labels" placeholder="bug, auth" ${dis} /></label>
      <label id="f-created-row"><span>Created</span><span id="f-created" class="dt-static"></span></label>
    </div>
    <div class="dt-tabs" ${readOnly ? "hidden" : ""}>
      <button type="button" data-mode="write">Write</button>
      <button type="button" data-mode="preview">Preview</button>
    </div>
    <textarea class="dt-editor" id="f-body" placeholder="Add a description… (markdown)"></textarea>
    <div class="dt-body" id="f-preview"></div>
    <div class="dt-footer">
      <span class="dt-path" id="f-path"></span>
      <span class="dt-actions">
        ${
          d.mode === "create"
            ? `<button type="button" class="btn" data-action="cancel">Cancel</button>
               <button type="button" class="btn btn-primary" data-action="create">Create ticket</button>`
            : readOnly
              ? ""
              : `<button type="button" class="btn btn-danger" data-action="delete">Delete</button>`
        }
      </span>
    </div>
  `;

  const $ = (id) => document.getElementById(id);
  const title = $("f-title");
  autoGrow(title);
  title.addEventListener("keydown", (e) => {
    if (e.key === "Enter") e.preventDefault(); // titles are single-line
  });

  for (const id of ["f-title", "f-assignee", "f-labels", "f-body"]) {
    $(id).addEventListener("input", onFieldInput);
  }
  $("f-priority").addEventListener("change", onFieldInput);
  $("f-size").addEventListener("change", onFieldInput);
  $("f-column").addEventListener("change", (e) => {
    if (d.mode === "create") d.column = e.target.value;
    else moveTicket(d.projectId, d.ticketId, e.target.value);
  });
  $("f-body").addEventListener("input", () => autoGrow($("f-body")));
  $("f-preview").addEventListener("click", (e) => {
    if (!readOnly && !e.target.closest("a")) setBodyMode("write", { focus: true });
  });
  els.drawerContent.querySelectorAll(".dt-tabs button").forEach((b) =>
    b.addEventListener("click", () => setBodyMode(b.dataset.mode, { focus: b.dataset.mode === "write" }))
  );

  const action = (name) => els.drawerContent.querySelector(`[data-action="${name}"]`);
  if (action("cancel")) action("cancel").addEventListener("click", closeDrawer);
  if (action("create")) action("create").addEventListener("click", createFromDrawer);
  if (action("delete")) {
    const btn = action("delete");
    let armed = null;
    btn.addEventListener("click", () => {
      if (!armed) {
        btn.textContent = "Click again to delete";
        armed = setTimeout(() => {
          armed = null;
          btn.textContent = "Delete";
        }, 3000);
        return;
      }
      clearTimeout(armed);
      deleteFromDrawer();
    });
  }
}

function fillDrawer(t) {
  const d = state.drawer;
  const $ = (id) => document.getElementById(id);
  $("f-id").textContent = t.id;
  $("f-title").value = t.title;
  $("f-priority").value = t.priority;
  $("f-size").value = t.size;
  $("f-assignee").value = t.assignee;
  // Hide unset fields on existing tickets; a new ticket still offers Assignee.
  $("f-assignee-row").hidden = !t.assignee && d.mode !== "create";
  $("f-labels").value = t.labels.join(", ");
  $("f-created").textContent = t.created;
  $("f-created-row").hidden = !t.created;
  $("f-column").value = t.column;
  $("f-body").value = t.body;
  if (d.mode === "create") {
    $("f-path").textContent = `${d.projectId}/${t.column}/${t.id}.md`;
  } else if (state.backend instanceof HttpBackend) {
    $("f-path").innerHTML = `<a href="${escapeAttr(new URL(t.path, state.backend.baseUrl))}" target="_blank" rel="noopener">${escapeHtml(t.path)}</a>`;
  } else {
    $("f-path").textContent = t.path;
  }
  autoGrow($("f-title"));
  setBodyMode(d.bodyMode);
}

function setBodyMode(mode, { focus = false } = {}) {
  const d = state.drawer;
  d.bodyMode = mode;
  const body = document.getElementById("f-body");
  const preview = document.getElementById("f-preview");
  const text = body.value.trim();
  body.hidden = mode !== "write";
  preview.hidden = mode !== "preview";
  if (mode === "preview") {
    preview.innerHTML = text ? renderMarkdown(text) : `<p class="dt-empty">No description.</p>`;
  } else {
    autoGrow(body);
    if (focus) body.focus();
  }
  els.drawerContent.querySelectorAll(".dt-tabs button").forEach((b) =>
    b.classList.toggle("active", b.dataset.mode === mode)
  );
}

function readForm() {
  const $ = (id) => document.getElementById(id);
  return {
    title: $("f-title").value.trim(),
    priority: $("f-priority").value,
    size: $("f-size").value,
    assignee: $("f-assignee").value.trim(),
    labels: $("f-labels").value.split(",").map((l) => l.trim()).filter(Boolean),
    body: $("f-body").value,
  };
}

function onFieldInput() {
  const d = state.drawer;
  if (!d || d.mode !== "edit") return;
  d.dirty = true;
  d.version++;
  setSaveStatus("Unsaved");
  clearTimeout(d.saveTimer);
  d.saveTimer = setTimeout(saveNow, AUTOSAVE_MS);
}

// Write the drawer's edits to disk. Only fields that actually changed are
// touched, so unknown frontmatter keys and formatting survive a save.
async function saveNow({ force = false } = {}) {
  const d = state.drawer;
  if (!d || d.mode !== "edit") return;
  clearTimeout(d.saveTimer);
  // Read the form now: the drawer DOM may be replaced while we wait below.
  const form = readForm();
  const version = d.version;
  while (d.saving) await d.saving;
  if (!d.dirty || d.deleted || (d.conflict && !force)) return;
  if (d.version !== version && d === state.drawer) return; // newer edits have their own save queued
  const ticket = findTicket(d.projectId, d.ticketId);
  if (!ticket) return;

  const before = ticketFromText(ticket.id, d.base.raw);
  const fields = {};
  if ((form.title || ticket.id) !== before.title) fields.title = form.title || ticket.id;
  if (form.priority !== before.priority) fields.priority = form.priority;
  if (form.size !== before.size) fields.size = form.size;
  if (form.assignee !== before.assignee) fields.assignee = form.assignee;
  if (form.labels.join("\n") !== before.labels.join("\n")) fields.labels = form.labels;
  // Forcing after a conflict: apply our changed fields on top of the current
  // disk version (read fresh, not from the last scan), so outside edits to
  // other fields are kept.
  const onDisk = force ? await state.backend.readText(ticket).catch(() => ticket.raw) : d.base.raw;
  const raw = updateTicketText(onDisk, fields, form.body);
  const ui = (fn) => d === state.drawer && fn();

  ui(() => setSaveStatus("Saving…"));
  d.saving = state.backend
    .writeTicket({ ...ticket, lastModified: d.base.lastModified }, raw, { force })
    .then(({ lastModified }) => {
      d.base = { raw, lastModified };
      d.conflict = false;
      if (d.version === version) d.dirty = false;
      ui(() => {
        showBanner(null);
        setSaveStatus(d.dirty ? "Unsaved" : "Saved");
        if (force) fillDrawer({ ...ticket, ...ticketFromText(ticket.id, raw) }); // show the merged result
      });
    })
    .catch((err) => {
      ui(() => setSaveStatus("Not saved"));
      if (err instanceof ConflictError) {
        d.conflict = true;
        if (d === state.drawer) showConflictBanner();
        else toast(`${d.ticketId} changed on disk; your last edits were not saved.`, "error");
      } else {
        toast(`Could not save ${d.ticketId}: ${err.message}`, "error");
      }
    })
    .finally(() => {
      d.saving = null;
    });
  await d.saving;
  refresh();
}

async function createFromDrawer() {
  const d = state.drawer;
  const project = state.board.projects.find((p) => p.id === d.projectId);
  const form = readForm();
  if (!form.title) {
    document.getElementById("f-title").focus();
    toast("Give the ticket a title first.");
    return;
  }
  const id = nextTicketId(project);
  const raw = updateTicketText(
    "",
    {
      title: form.title,
      assignee: form.assignee,
      priority: form.priority,
      size: form.size,
      labels: form.labels,
      created: today(),
    },
    form.body
  );
  try {
    await state.backend.createTicket(project, d.column, id, raw);
  } catch (err) {
    toast(`Could not create the ticket: ${err.message}`, "error");
    return;
  }
  state.drawer = null;
  await refresh();
  openTicket(project.id, id);
}

async function deleteFromDrawer() {
  const d = state.drawer;
  const ticket = findTicket(d.projectId, d.ticketId);
  if (!ticket) return;
  clearTimeout(d.saveTimer);
  try {
    await state.backend.deleteTicket(ticket);
  } catch (err) {
    toast(`Could not delete ${ticket.id}: ${err.message}`, "error");
    return;
  }
  d.dirty = false;
  closeDrawer();
  toast(`Deleted ${ticket.id}.`);
  refresh();
}

// Called after every rescan: reflect outside changes in the open ticket.
function syncDrawerWithDisk() {
  const d = state.drawer;
  if (!d || d.mode !== "edit") return;
  const ticket = findTicket(d.projectId, d.ticketId);
  if (!ticket) {
    if (d.saving) return; // a move is in flight
    d.deleted = true;
    showBanner(`<span>This ticket was deleted or renamed on disk.</span>`);
    setSaveStatus("");
    return;
  }
  if (d.deleted) {
    d.deleted = false;
    showBanner(null);
  }
  document.getElementById("f-column").value = ticket.column;
  document.getElementById("f-path").textContent = ticket.path || "";
  if (ticket.raw === d.base.raw) {
    d.base.lastModified = ticket.lastModified; // e.g. moved, content untouched
    return;
  }
  if (d.saving) return; // our own write; the next rescan will settle
  if (d.dirty) {
    d.conflict = true;
    clearTimeout(d.saveTimer);
    setSaveStatus("Not saved");
    showConflictBanner();
    return;
  }
  d.base = { raw: ticket.raw, lastModified: ticket.lastModified };
  fillDrawer(ticket);
}

function showConflictBanner() {
  showBanner(`
    <span>This ticket changed on disk while you were editing.</span>
    <span class="dt-banner-actions">
      <button type="button" class="btn" data-banner="reload">Load disk version</button>
      <button type="button" class="btn btn-primary" data-banner="overwrite">Apply my changes</button>
    </span>`);
  const banner = document.getElementById("dt-banner");
  banner.querySelector('[data-banner="reload"]').addEventListener("click", () => {
    const d = state.drawer;
    const ticket = findTicket(d.projectId, d.ticketId);
    if (!ticket) return;
    Object.assign(d, { dirty: false, conflict: false, base: { raw: ticket.raw, lastModified: ticket.lastModified } });
    showBanner(null);
    setSaveStatus("");
    fillDrawer(ticket);
  });
  banner.querySelector('[data-banner="overwrite"]').addEventListener("click", () => saveNow({ force: true }));
}

function showBanner(html) {
  const banner = document.getElementById("dt-banner");
  if (!banner) return;
  banner.hidden = !html;
  banner.innerHTML = html || "";
}

function setSaveStatus(text) {
  const el = document.getElementById("dt-save");
  if (el) el.textContent = text;
}

function showDrawer() {
  els.drawer.hidden = false;
  els.drawerOverlay.hidden = false;
  els.drawer.setAttribute("aria-hidden", "false");
  // Textareas can only measure their content once the drawer is displayed.
  autoGrow(document.getElementById("f-title"));
  if (state.drawer.bodyMode === "write") autoGrow(document.getElementById("f-body"));
  requestAnimationFrame(() => els.drawer.classList.add("open"));
}

function closeDrawer() {
  const d = state.drawer;
  if (d && d.mode === "edit" && d.dirty && !d.conflict) saveNow();
  state.drawer = null;
  els.drawer.classList.remove("open");
  els.drawer.setAttribute("aria-hidden", "true");
  els.drawer.hidden = true;
  els.drawerOverlay.hidden = true;
}

function onGlobalKey(e) {
  const d = state.drawer;
  if (e.key === "Escape" && d) {
    closeDrawer();
  } else if ((e.metaKey || e.ctrlKey) && e.key === "s" && d) {
    e.preventDefault();
    saveNow();
  } else if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && d && d.mode === "create") {
    e.preventDefault();
    createFromDrawer();
  } else if (
    e.key === "/" && !d && !e.metaKey && !e.ctrlKey && !e.altKey &&
    !e.target.closest("input, textarea, select") && !els.searchBox.hidden
  ) {
    e.preventDefault();
    els.search.focus();
    els.search.select();
  } else if (
    e.key === "c" && !d && !e.metaKey && !e.ctrlKey && !e.altKey &&
    !e.target.closest("input, textarea, select") &&
    state.backend && !state.backend.readOnly && currentProject()
  ) {
    e.preventDefault();
    openCreate(state.projectId);
  }
}

// --------------------------------------------------------------------------- //
// Small utilities
// --------------------------------------------------------------------------- //
function toast(message, kind = "info") {
  const el = document.createElement("div");
  el.className = `toast toast-${kind}`;
  el.textContent = message;
  els.toasts.appendChild(el);
  setTimeout(() => el.remove(), kind === "error" ? 6000 : 3000);
}

function autoGrow(el) {
  el.style.height = "auto";
  el.style.height = `${el.scrollHeight}px`;
}

function today() {
  const d = new Date();
  const pad = (n) => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

function initials(name) {
  return name
    .split(/[\s._-]+/)
    .filter(Boolean)
    .slice(0, 2)
    .map((p) => p[0].toUpperCase())
    .join("");
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function escapeAttr(str) {
  return escapeHtml(str).replace(/"/g, "&quot;");
}

}
