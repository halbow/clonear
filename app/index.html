<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Network lockdown, enforced by the browser: the page can't fetch or send
      anything, anywhere. It only reads and writes the folder you pick.
      bundle.py swaps 'unsafe-inline' in script-src for the hashes of the
      inlined scripts, so only the bundled code can run.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clonear</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%97%90%3C/text%3E%3C/svg%3E"
    />
    <script>
      // Chrome blocks module scripts on file://, so this dev page can't run
      // there; hand over to the single-file build. (No-op inside the bundle.)
      if (location.protocol === "file:" && /\/app\/(index\.html)?$/.test(location.pathname)) {
        location.replace("../dist/clonear.html" + location.hash);
      }
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="logo">◐</span>
        <span class="brand-name">Clonear</span>
      </div>
      <label class="project-picker">
        <span class="sr-only">Project</span>
        <select id="project-select" aria-label="Select project" hidden></select>
      </label>
      <label class="search" hidden id="search-box">
        <span class="sr-only">Search tickets</span>
        <input id="search" type="search" placeholder="Search tickets…  /" autocomplete="off" spellcheck="false" />
      </label>
      <div class="topbar-spacer"></div>
      <span id="sync-status" class="sync-status" hidden></span>
      <span id="ticket-count" class="ticket-count" hidden></span>
      <button id="new-ticket" class="btn btn-primary" title="New ticket (C)" hidden>+ New ticket</button>
      <button id="project-settings" class="btn" title="Project settings, open or create a project" hidden>Settings</button>
      <!-- Folder picker for browsers without the File System Access API (read-only board). -->
      <input id="folder-input" type="file" webkitdirectory multiple hidden />
    </header>

    <div id="notices" class="notices" hidden></div>

    <main id="board" class="board" aria-live="polite"></main>

    <!-- Ticket detail drawer -->
    <div id="drawer-overlay" class="drawer-overlay" hidden></div>
    <aside id="drawer" class="drawer" hidden aria-hidden="true" role="dialog" aria-modal="true">
      <button id="drawer-close" class="drawer-close" aria-label="Close">✕</button>
      <div id="drawer-content" class="drawer-content"></div>
    </aside>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script type="module" src="app.js"></script>
  </body>
</html>
